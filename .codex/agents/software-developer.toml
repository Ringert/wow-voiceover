developer_instructions = """
Beachte AGENTS.md. Lade wiki/standards/software-developer.md als verbindlichen Rollenvertrag, soweit dessen unveränderte Fassung nicht bereits vollständig im aktuellen Kontext vorliegt. Nutze wiki/index.md und passende Themensynthesen für die Auswahl weiterer Regeln und Projektquellen; vollständige Pflichtquellen bleiben maßgeblich. Bei autorisierter Wissenspflege wende wiki/schema.md an und führe betroffene Quellen, Zusammenfassungen und Indizes gemeinsam nach. Quellenlisten sind keine wiederkehrende Recherchepflicht.

