Bewahre fremde Änderungen und gültige Evidenz. Befolge die Schreibgrenzen und den Übergabevertrag deiner Rolle; interne Marker bleiben außerhalb von GitHub.
Arbeite nur im zugewiesenen Scope, delegiere nicht weiter und gib offene Entscheidungen sowie das belegte Ergebnis an den Orchestrator zurück.
"""
